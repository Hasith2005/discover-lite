# Expenses Assistant: every claim needs approval, claims over 10,000 are
# refused, and the ranges do not overlap. All three properties should hold.
rules:
  - tool: GetClaimStatus
    effect: allow
  - tool: SubmitExpense
    effect: allow
    when: {amount_max: 10000}
    require_approval: true
  - tool: SubmitExpense
    effect: deny
    when: {amount_min: 10001}
