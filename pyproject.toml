[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discover-lite"
version = "0.1.0"
description = "Static analyser for AI agent configurations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hasith Kakarla" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "typer",
    "scikit-learn",
    "pyyaml",
    "z3-solver",
    "jinja2",
    # CVSS v4.0 base scores, the input to OWASP AIVSS.
    "cvss>=3.2",
    # tomllib is built into Python 3.11+; tomli is the same parser for 3.10.
    'tomli>=2; python_version < "3.11"',
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
discover-lite = "discover_lite.cli:app"

# Tell setuptools the package lives under src/.
[tool.setuptools.packages.find]
where = ["src"]

# Ship the mappings file, report template and gitleaks rules inside the package.
[tool.setuptools.package-data]
discover_lite = ["mappings.yaml", "templates/*.html", "rules/*"]

[tool.pytest.ini_options]
# Lets tests import discover_lite without installing the package first.
pythonpath = ["src"]
testpaths = ["tests"]
